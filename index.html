<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <!-- Content Security Policy (OWASP Defense-in-Depth) -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; frame-src 'self' about:; object-src 'none'; base-uri 'self';">
  <!-- Configuración nativa para iPhone / iOS Web App -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Honda ESM">
  <meta name="format-detection" content="telephone=no">
  <meta name="theme-color" content="#e2e8f0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16181d" media="(prefers-color-scheme: dark)">
  <link rel="apple-touch-icon" href="HondaESM.png">
  <link rel="apple-touch-icon" sizes="180x180" href="HondaESM.png">
  <title>Honda Accord - Manual Técnico Electrónico</title>
  <link rel="icon" type="image/png" href="HondaESM.png">
  <style>
    /* ==========================================================================
       NEUMORPHISM DESIGN SYSTEM (SOFT UI) & IPHONE / IOS ADAPTATION
       ========================================================================== */
    :root {
      /* Safe Areas para iPhone con Notch / Dynamic Island y Home Indicator */
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
      --sal: env(safe-area-inset-left, 0px);
      --sar: env(safe-area-inset-right, 0px);

      --bg: #e2e8f0;
      --surface: #e2e8f0;
      --surface-subtle: #eaeff5;
      --shadow-raised: 6px 6px 14px #c2c9d4, -6px -6px 14px #ffffff;
      --shadow-raised-sm: 3px 3px 7px #c2c9d4, -3px -3px 7px #ffffff;
      --shadow-raised-lg: 12px 12px 24px #c2c9d4, -12px -12px 24px #ffffff;
      --shadow-inset: inset 4px 4px 8px #c2c9d4, inset -4px -4px 8px #ffffff;
      --shadow-inset-sm: inset 2px 2px 5px #c2c9d4, inset -2px -2px 5px #ffffff;
      
      --primary: #dc2626;
      --primary-hover: #b91c1c;
      --primary-light: rgba(220, 38, 38, 0.1);
      --primary-glow: rgba(220, 38, 38, 0.25);
      
      --text-main: #1e293b;
      --text-muted: #64748b;
      --text-faint: #94a3b8;
      
      --border-soft: rgba(255, 255, 255, 0.8);
      --divider: #cbd5e1;
      
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --radius-full: 9999px;
      
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, "Inter", sans-serif;
      --transition: all 0.22s cubic-bezier(0.4, 0, 0.2, 1);
    }

    [data-theme="dark"] {
      --bg: #16181d;
      --surface: #16181d;
      --surface-subtle: #1c2026;
      --shadow-raised: 6px 6px 14px #0e1014, -6px -6px 14px #1e2128;
      --shadow-raised-sm: 3px 3px 7px #0e1014, -3px -3px 7px #1e2128;
      --shadow-raised-lg: 12px 12px 24px #0e1014, -12px -12px 24px #1e2128;
      --shadow-inset: inset 4px 4px 8px #0e1014, inset -4px -4px 8px #1e2128;
      --shadow-inset-sm: inset 2px 2px 5px #0e1014, inset -2px -2px 5px #1e2128;
      
      --primary: #ef4444;
      --primary-hover: #f87171;
      --primary-light: rgba(239, 68, 68, 0.15);
      --primary-glow: rgba(239, 68, 68, 0.4);
      
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-faint: #64748b;
      
      --border-soft: rgba(255, 255, 255, 0.05);
      --divider: #232730;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      height: 100%;
      height: 100dvh;
      -webkit-text-size-adjust: 100%;
    }

    body {
      font-family: var(--font);
      background-color: var(--bg);
      color: var(--text-main);
      height: 100%;
      height: 100dvh;
      min-height: -webkit-fill-available;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: background-color 0.3s ease, color 0.3s ease;
      touch-action: manipulation;
    }

    /* ==========================================================================
       HEADER & NAVIGATION CONTROLS
       ========================================================================== */
    .app-header {
      height: 68px;
      background: var(--surface);
      box-shadow: var(--shadow-raised-sm);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      z-index: 30;
      gap: 14px;
      border-bottom: 1px solid var(--border-soft);
      flex-shrink: 0;
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 220px;
    }

    .brand-logo-neu {
      width: 42px;
      height: 42px;
      border-radius: var(--radius-md);
      background: var(--surface);
      box-shadow: var(--shadow-raised);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--primary);
      flex-shrink: 0;
    }

    .brand-logo-neu svg {
      width: 24px;
      height: 24px;
      fill: currentColor;
    }

    .brand-text h1 {
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .brand-badge {
      font-size: 0.65rem;
      font-weight: 700;
      background: var(--primary);
      color: #fff;
      padding: 2px 6px;
      border-radius: var(--radius-full);
      letter-spacing: 0.06em;
    }

    .brand-text p {
      font-size: 0.72rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* CENTER CONTROLS */
    .controls-section {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      justify-content: center;
      max-width: 780px;
    }

    .neu-segmented {
      display: flex;
      background: var(--surface);
      box-shadow: var(--shadow-inset-sm);
      padding: 3px;
      border-radius: var(--radius-full);
      gap: 3px;
      flex-shrink: 0;
    }

    .neu-segment-btn {
      border: none;
      background: transparent;
      padding: 6px 12px;
      border-radius: var(--radius-full);
      font-family: inherit;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: var(--transition);
      white-space: nowrap;
    }

    .neu-segment-btn:hover {
      color: var(--text-main);
    }

    .neu-segment-btn.active {
      background: var(--surface);
      box-shadow: var(--shadow-raised-sm);
      color: var(--primary);
    }

    /* SEARCH BAR */
    .search-container {
      position: relative;
      flex: 1;
      max-width: 320px;
      min-width: 160px;
    }

    .neu-search-input {
      width: 100%;
      height: 38px;
      background: var(--surface);
      box-shadow: var(--shadow-inset-sm);
      border: 1px solid transparent;
      border-radius: var(--radius-full);
      padding: 0 36px 0 36px;
      font-family: inherit;
      font-size: 0.82rem;
      color: var(--text-main);
      outline: none;
      transition: var(--transition);
    }

    .neu-search-input:focus {
      border-color: var(--primary);
      box-shadow: var(--shadow-inset), 0 0 0 3px var(--primary-glow);
    }

    .search-icon-left {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
    }

    .search-clear-btn {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
      border-radius: 50%;
    }

    .search-clear-btn.visible {
      display: flex;
    }

    /* HEADER RIGHT ACTIONS */
    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .neu-icon-btn {
      width: 38px;
      height: 38px;
      border-radius: var(--radius-full);
      background: var(--surface);
      box-shadow: var(--shadow-raised-sm);
      border: none;
      cursor: pointer;
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition);
      position: relative;
    }

    .neu-icon-btn:hover {
      transform: translateY(-1px);
      box-shadow: var(--shadow-raised);
      color: var(--primary);
    }

    .neu-icon-btn:active, .neu-icon-btn.active {
      transform: translateY(1px);
      box-shadow: var(--shadow-inset-sm);
      color: var(--primary);
    }

    /* ==========================================================================
       THREE-PANEL LAYOUT
       ========================================================================== */
    .app-main {
      flex: 1;
      display: flex;
      overflow: hidden;
      padding: 12px;
      gap: 12px;
      position: relative;
    }

    .neu-card {
      background: var(--surface);
      box-shadow: var(--shadow-raised);
      border-radius: var(--radius-lg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid var(--border-soft);
      transition: var(--transition);
      position: relative;
    }

    .panel-header {
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--divider);
      gap: 8px;
      flex-shrink: 0;
    }

    .panel-header h2 {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 7px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .count-badge {
      font-size: 0.7rem;
      font-weight: 700;
      background: var(--surface);
      box-shadow: var(--shadow-inset-sm);
      padding: 2px 7px;
      border-radius: var(--radius-full);
      color: var(--primary);
      flex-shrink: 0;
    }

    /* PANEL 1: SYSTEMS TREE */
    .panel-systems {
      width: 310px;
      flex-shrink: 0;
    }

    .filter-box-wrap {
      padding: 8px 12px;
      border-bottom: 1px solid var(--divider);
      flex-shrink: 0;
    }

    .neu-filter-input {
      width: 100%;
      height: 32px;
      background: var(--surface);
      box-shadow: var(--shadow-inset-sm);
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      padding: 0 10px;
      font-size: 0.78rem;
      color: var(--text-main);
      outline: none;
      font-family: inherit;
    }

    .neu-filter-input:focus {
      border-color: var(--primary);
    }

    .tree-scroll-area {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .tree-item {
      display: flex;
      align-items: center;
      padding: 6px 10px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-main);
      transition: var(--transition);
      user-select: none;
      gap: 8px;
    }

    .tree-item:hover {
      background: var(--surface-subtle);
      transform: translateX(2px);
    }

    .tree-item.active {
      background: var(--surface);
      box-shadow: var(--shadow-inset-sm);
      color: var(--primary);
      font-weight: 700;
      border-left: 3px solid var(--primary);
    }

    .tree-toggle-icon {
      width: 16px;
      height: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      transition: transform 0.2s ease;
      flex-shrink: 0;
    }

    .tree-toggle-icon.expanded {
      transform: rotate(90deg);
    }

    .tree-folder-icon {
      width: 15px;
      height: 15px;
      color: var(--primary);
      flex-shrink: 0;
      opacity: 0.85;
    }

    .tree-title {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .tree-children {
      display: none;
      flex-direction: column;
      gap: 2px;
      margin-left: 12px;
      padding-left: 6px;
      border-left: 2px dashed var(--divider);
    }

    .tree-children.open {
      display: flex;
    }

    /* PANEL 2: PROCEDURES LIST */
    .panel-procedures {
      width: 340px;
      flex-shrink: 0;
    }

    .proc-scroll-area {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .proc-card {
      background: var(--surface);
      box-shadow: var(--shadow-raised-sm);
      border-radius: var(--radius-md);
      padding: 10px 12px;
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      align-items: flex-start;
      gap: 10px;
      border: 1px solid var(--border-soft);
      position: relative;
    }

    .proc-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-raised);
    }

    .proc-card.active {
      box-shadow: var(--shadow-inset-sm);
      border-color: var(--primary);
    }

    .proc-card.active::before {
      content: '';
      position: absolute;
      left: 0;
      top: 10px;
      bottom: 10px;
      width: 4px;
      border-radius: 0 4px 4px 0;
      background: var(--primary);
    }

    .proc-icon-wrap {
      width: 32px;
      height: 32px;
      border-radius: var(--radius-sm);
      background: var(--surface);
      box-shadow: var(--shadow-raised-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--primary);
      flex-shrink: 0;
    }

    .proc-card.active .proc-icon-wrap {
      box-shadow: var(--shadow-inset-sm);
    }

    .proc-details {
      flex: 1;
      min-width: 0;
    }

    .proc-title {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-main);
      line-height: 1.35;
      margin-bottom: 3px;
      word-break: break-word;
    }

    .proc-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.68rem;
      color: var(--text-muted);
    }

    .proc-fav-btn {
      background: transparent;
      border: none;
      color: var(--text-faint);
      cursor: pointer;
      padding: 2px;
      transition: color 0.15s ease;
    }

    .proc-fav-btn.active {
      color: #eab308;
    }

    /* EMPTY STATE */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 16px;
      text-align: center;
      color: var(--text-muted);
      height: 100%;
      gap: 12px;
    }

    .empty-icon-neu {
      width: 54px;
      height: 54px;
      border-radius: var(--radius-full);
      background: var(--surface);
      box-shadow: var(--shadow-inset-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-faint);
    }

    /* PANEL 3: VIEWER */
    .panel-viewer {
      flex: 1;
      min-width: 380px;
    }

    .viewer-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 16px;
      border-bottom: 1px solid var(--divider);
      background: var(--surface);
      gap: 10px;
      flex-shrink: 0;
    }

    .breadcrumb-nav {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    .breadcrumb-active {
      color: var(--primary);
      font-weight: 600;
    }

    .viewer-tools {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .tool-btn {
      height: 30px;
      padding: 0 9px;
      border-radius: var(--radius-sm);
      background: var(--surface);
      box-shadow: var(--shadow-raised-sm);
      border: none;
      font-family: inherit;
      font-size: 0.74rem;
      font-weight: 600;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      transition: var(--transition);
      white-space: nowrap;
    }

    .tool-btn:hover {
      box-shadow: var(--shadow-raised);
      color: var(--primary);
    }

    .tool-btn:active {
      box-shadow: var(--shadow-inset-sm);
    }

    .viewer-content-area {
      flex: 1;
      position: relative;
      background: var(--surface);
      overflow: hidden;
    }

    #docIframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #ffffff;
      transition: opacity 0.2s ease;
    }

    [data-theme="dark"] #docIframe {
      background: #16181d;
    }

    .viewer-loader {
      position: absolute;
      inset: 0;
      background: var(--surface);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      z-index: 10;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .viewer-loader.active {
      opacity: 1;
      pointer-events: auto;
    }

    .neu-spinner {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--surface);
      box-shadow: var(--shadow-raised);
      border: 3px solid transparent;
      border-top-color: var(--primary);
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    /* ==========================================================================
       NEUMORPHIC LIGHTBOX MODAL (NO MORE POPUPS!)
       ========================================================================== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(4px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .neu-modal-container {
      width: 92vw;
      height: 88vh;
      background: var(--surface);
      box-shadow: var(--shadow-raised-lg);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-soft);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: modalPop 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes modalPop {
      0% { opacity: 0; transform: scale(0.95); }
      100% { opacity: 1; transform: scale(1); }
    }

    .modal-header {
      padding: 12px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--divider);
      gap: 10px;
    }

    .modal-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .modal-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .modal-canvas-wrap {
      flex: 1;
      overflow: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--surface-subtle);
      position: relative;
      cursor: grab;
      user-select: none;
    }

    .modal-canvas-wrap:active {
      cursor: grabbing;
    }

    .modal-canvas-inner {
      position: relative;
      transform-origin: center center;
      transition: transform 0.15s ease-out;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: var(--shadow-raised);
      padding: 10px;
      margin: auto;
    }

    [data-theme="dark"] .modal-canvas-inner {
      background: #20242b;
    }

    .modal-diagram-img {
      display: block;
      max-width: none;
    }

    .modal-callout-item {
      position: absolute;
      white-space: nowrap;
      pointer-events: auto;
    }

    /* ==========================================================================
       IPHONE & MOBILE OPTIMIZATIONS (SAFARI / WEBKIT)
       ========================================================================== */
    .mobile-back-btn {
      display: none;
      height: 34px;
      padding: 0 10px;
      border-radius: var(--radius-sm);
      background: var(--surface);
      box-shadow: var(--shadow-raised-sm);
      border: none;
      font-size: 0.76rem;
      font-weight: 700;
      color: var(--text-main);
      align-items: center;
      gap: 5px;
      cursor: pointer;
      flex-shrink: 0;
      transition: var(--transition);
    }

    .mobile-back-btn:active {
      box-shadow: var(--shadow-inset-sm);
      color: var(--primary);
    }

    .mobile-subbar {
      display: none;
    }

    .mobile-tab-bar {
      display: none;
    }

    .mobile-search-bar-wrap {
      display: none;
    }

    /* Scroll containers momentum */
    .tree-scroll-area,
    .proc-scroll-area,
    .modal-canvas-wrap {
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
    }

    /* Prevención de zoom automático molesto en iOS al hacer foco en inputs */
    @media (max-width: 768px) {
      input, select, textarea, .neu-search-input, .neu-filter-input {
        font-size: 16px !important;
      }
    }

    /* Media query para pantallas táctiles y móviles (iPhone, etc.) */
    @media (max-width: 768px) {
      /* HEADER COMPACTO PARA IPHONE */
      .app-header {
        height: auto;
        min-height: 54px;
        padding: max(8px, var(--sat)) max(12px, var(--sar)) 8px max(12px, var(--sal));
        gap: 8px;
        border-bottom: 1px solid var(--divider);
      }

        flex-shrink: 0;

        display: flex;
        align-items: center;
        justify-content: space-between;

        gap: 6px;

        height: 34px;
        padding: 0 8px;
        font-size: 0.74rem;
      }

      #printBtn,
      #fullscreenBtn {
        display: none !important;
      }

      /* BARRA DE PESTAÑAS INFERIOR (TAB BAR ESTILO NATIVO IOS) */
      .mobile-tab-bar {
        display: flex;
        align-items: center;
        justify-content: space-around;
        background: var(--surface);
        border-top: 1px solid var(--divider);
        padding: 6px max(8px, var(--sal)) max(8px, var(--sab)) max(8px, var(--sar));

      }

      .tab-btn {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: transparent;
        border: none;
        padding: 4px 2px;
        color: var(--text-muted);
        font-family: inherit;
        font-size: 0.68rem;
        font-weight: 600;
        cursor: pointer;
        transition: var(--transition);
        border-radius: var(--radius-sm);
        gap: 3px;
        min-height: 48px;
        -webkit-tap-highlight-color: transparent;
      }

      .tab-btn:active {
        transform: scale(0.96);
      }

      .tab-btn.active {
        color: var(--primary);
      }

      .tab-btn.active .tab-icon-wrap {
        background: var(--surface);
        box-shadow: var(--shadow-inset-sm);
        color: var(--primary);
      }

      .tab-icon-wrap {
        width: 32px;
        height: 28px;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;

      /* LIGHTBOX MODAL EN IPHONE (PANTALLA COMPLETA) */
      .modal-overlay {

      .neu-modal-container {

        height: 100vh;

        font-size: 0.72rem;
      }

    }

    /* FULLSCREEN VIEWER EN ESCRITORIO */
    body.viewer-fullscreen .panel-systems,
    body.viewer-fullscreen .panel-procedures {

    }

          <button class="tool-btn" id="modalFitScreen">Ajustar</button>
          <button class="neu-icon-btn" id="modalCloseBtn" style="width:32px;height:32px;" title="Cerrar (Esc)">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
      </div>
      <div class="modal-canvas-wrap" id="modalCanvasWrap">
        <div class="modal-canvas-inner" id="modalCanvasInner">
          <img id="modalDiagramImg" class="modal-diagram-img" alt="Diagrama">
          <div id="modalCalloutsContainer"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ================= CORE APPLICATION SCRIPT ================= -->
  <script>
    (function() {
      // Estado central de la aplicación
      const state = {
        lang: localStorage.getItem('honda_lang') || 'S00',
        year: localStorage.getItem('honda_year') || '5',
        theme: localStorage.getItem('honda_theme') || 'light',
        selectedSectionKey: null,
        selectedProcedureDbKey: null,
        activeDocTitleText: '',
        zoomLevel: 100,
        modalZoomLevel: 100,
        data: null,
        bookmarks: JSON.parse(localStorage.getItem('honda_bookmarks') || '[]'),
        recents: JSON.parse(localStorage.getItem('honda_recents') || '[]'),
        viewMode: 'normal', // 'normal', 'favorites', 'recents'
        mobileTab: 'systems', // 'systems', 'procedures', 'viewer', 'search', 'favorites'
        lastMobileTab: 'procedures'
      };

      // Elementos DOM
      const docIframe = document.getElementById('docIframe');
      const viewerLoader = document.getElementById('viewerLoader');
      const panelSystems = document.getElementById('panelSystems');
      const systemsTreeContainer = document.getElementById('systemsTreeContainer');
      const panelProcedures = document.getElementById('panelProcedures');
      const proceduresListContainer = document.getElementById('proceduresListContainer');
      const proceduresPanelTitle = document.getElementById('proceduresPanelTitle');
      const proceduresCountBadge = document.getElementById('proceduresCountBadge');
      const systemsCountBadge = document.getElementById('systemsCountBadge');
      const viewerBreadcrumb = document.getElementById('viewerBreadcrumb');
      const activeDocTitle = document.getElementById('activeDocTitle');
      const panelViewer = document.getElementById('panelViewer');
      const globalSearchInput = document.getElementById('globalSearchInput');
      const searchClearBtn = document.getElementById('searchClearBtn');
      const treeFilterInput = document.getElementById('treeFilterInput');
      const themeToggleBtn = document.getElementById('themeToggleBtn');
      const themeSunIcon = document.getElementById('themeSunIcon');
      const themeMoonIcon = document.getElementById('themeMoonIcon');
      const zoomInBtn = document.getElementById('zoomInBtn');
      const zoomOutBtn = document.getElementById('zoomOutBtn');
      const zoomResetBtn = document.getElementById('zoomResetBtn');
      const printBtn = document.getElementById('printBtn');
      const fullscreenBtn = document.getElementById('fullscreenBtn');
      const mobileBackBtn = document.getElementById('mobileBackBtn');
      const favDocBtn = document.getElementById('favDocBtn');
      const favDocStar = document.getElementById('favDocStar');
      const favoritesBtn = document.getElementById('favoritesBtn');
      const recentsBtn = document.getElementById('recentsBtn');

      // Elementos DOM Móvil / iPhone
      const mobileTabBar = document.getElementById('mobileTabBar');
      const mobileSystemsBadge = document.getElementById('mobileSystemsBadge');
      const mobileProceduresBadge = document.getElementById('mobileProceduresBadge');
      const mobileFavoritesBadge = document.getElementById('mobileFavoritesBadge');
      const mobileSearchWrap = document.getElementById('mobileSearchWrap');
      const mobileSearchInput = document.getElementById('mobileSearchInput');
      const mobileSearchClearBtn = document.getElementById('mobileSearchClearBtn');

      // Modal Diagram Elements
      const diagramModal = document.getElementById('diagramModal');
      const modalCloseBtn = document.getElementById('modalCloseBtn');
      const modalCanvasWrap = document.getElementById('modalCanvasWrap');
      const modalCanvasInner = document.getElementById('modalCanvasInner');
      const modalDiagramImg = document.getElementById('modalDiagramImg');
      const modalCalloutsContainer = document.getElementById('modalCalloutsContainer');
      const modalDiagramTitle = document.getElementById('modalDiagramTitle');
      const modalZoomIn = document.getElementById('modalZoomIn');
      const modalZoomOut = document.getElementById('modalZoomOut');
      const modalZoomReset = document.getElementById('modalZoomReset');
      const modalFitScreen = document.getElementById('modalFitScreen');

      // 1. TEMA CLARO / OSCURO NEUMÓRFICO
      function applyTheme(theme) {
        state.theme = theme;
        document.documentElement.setAttribute('data-theme', theme);
        localStorage.setItem('honda_theme', theme);
        if (theme === 'dark') {
          themeSunIcon.style.display = 'block';
          themeMoonIcon.style.display = 'none';
        } else {
          themeSunIcon.style.display = 'none';
          themeMoonIcon.style.display = 'block';
        }
        injectNeumorphicStylesIntoIframe();
      }
      applyTheme(state.theme);

      themeToggleBtn.addEventListener('click', () => {
        applyTheme(state.theme === 'light' ? 'dark' : 'light');
      });

      // 2. CARGA DE BASE DE DATOS
      async function loadDatabase() {
        try {
          const res = await fetch('esm_data.json');
          state.data = await res.json();
          initRoutingAndRender();
        } catch(e) {
          console.error('Error cargando esm_data.json:', e);
          proceduresListContainer.innerHTML = '<div class="empty-state"><p>Error cargando la base de datos.</p></div>';
        }
      }

      // Utilidad de sanitización para prevenir DOM XSS (OWASP A03:2021)
      function escapeHTML(str) {
        if (str === null || str === undefined) return '';
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      // 3. ENRUTAMIENTO Y URL PARAMS (CON VALIDACIÓN ESTRICTA)
      function initRoutingAndRender() {
        const urlParams = new URLSearchParams(window.location.search);
        const rawType = urlParams.get('type');
        const rawYear = urlParams.get('year');
        const rawDoc = urlParams.get('doc');

        // Validación estricta por lista blanca para evitar inyección y traversal
        if (rawType && /^(S00|S01|A00|A01)$/.test(rawType)) {
          state.lang = rawType;
        }
        if (rawYear && /^[345]$/.test(rawYear)) {
          state.year = rawYear;
        }
        const targetDoc = (rawDoc && /^[A-Za-z0-9_-]{5,40}$/.test(rawDoc)) ? rawDoc : null;

        updateHeaderControls();
        renderSystemsTree();
        updateBookmarkBadges();

        if (targetDoc) {
          navigateToDbKey(targetDoc, false);
          if (window.innerWidth <= 768) {
            switchMobileTab('viewer');
          }
        } else {
          // Abrir primera sección por defecto
          const firstTreeItem = systemsTreeContainer.querySelector('.tree-item');
          if (firstTreeItem) firstTreeItem.click();
          if (window.innerWidth <= 768) {
            switchMobileTab('systems');
          }
        }
      }

      function updateHeaderControls() {
        document.querySelectorAll('#manualTypeGroup button, #mobileManualTypeGroup button').forEach(btn => {
          btn.classList.toggle('active', btn.getAttribute('data-type') === state.lang);
        });
        document.querySelectorAll('#yearGroup button, #mobileYearGroup button').forEach(btn => {
          btn.classList.toggle('active', btn.getAttribute('data-year') === state.year);
        });
      }

      function handleTypeChange(newType) {
        state.lang = newType;
        localStorage.setItem('honda_lang', state.lang);
        state.selectedSectionKey = null;
        state.selectedProcedureDbKey = null;
        updateHeaderControls();
        renderSystemsTree();
        resetProceduresPanel();
        if (window.innerWidth <= 768) {
          switchMobileTab('systems');
        }
      }

      function handleYearChange(newYear) {
        state.year = newYear;
        localStorage.setItem('honda_year', state.year);
        state.selectedSectionKey = null;
        state.selectedProcedureDbKey = null;
        updateHeaderControls();
        renderSystemsTree();
        resetProceduresPanel();
        if (window.innerWidth <= 768) {
          switchMobileTab('systems');
        }
      }

      document.querySelectorAll('#manualTypeGroup button, #mobileManualTypeGroup button').forEach(btn => {
        btn.addEventListener('click', () => {
          handleTypeChange(btn.getAttribute('data-type'));
        });
      });

      document.querySelectorAll('#yearGroup button, #mobileYearGroup button').forEach(btn => {
        btn.addEventListener('click', () => {
          handleYearChange(btn.getAttribute('data-year'));
        });
      });

      // 4. RENDERIZAR ÁRBOL DE SISTEMAS
      function renderSystemsTree(filterTerm = '') {
        const curData = (state.data && state.data[state.lang] && state.data[state.lang][state.year]);
        if (!curData || !curData.tree) {
          systemsTreeContainer.innerHTML = '<div class="empty-state"><p>No hay datos disponibles.</p></div>';
          return;
        }

        const treeList = curData.tree;
        const normFilter = filterTerm.trim().toLowerCase();

        systemsTreeContainer.innerHTML = '';
        systemsCountBadge.textContent = treeList.length;
        if (mobileSystemsBadge) mobileSystemsBadge.textContent = treeList.length;

        let currentRoot = null;
        let currentSub = null;

        treeList.forEach((node, idx) => {
          const isMatch = !normFilter || node.title.toLowerCase().includes(normFilter);
          
          const itemEl = document.createElement('div');
          itemEl.className = 'tree-item';
          itemEl.setAttribute('data-key', node.key);
          itemEl.setAttribute('data-level', node.lvl);

          const nextNode = treeList[idx + 1];
          const hasChildren = nextNode && nextNode.lvl > node.lvl;

          itemEl.innerHTML = `
            ${hasChildren ? `
              <span class="tree-toggle-icon">
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
              </span>
            ` : `<span style="width:16px;"></span>`}
            <svg class="tree-folder-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
            </svg>
            <span class="tree-title" title="${escapeHTML(node.title)}">${escapeHTML(node.title)}</span>
          `;

          let childrenWrap = null;
          if (hasChildren) {
            childrenWrap = document.createElement('div');
            childrenWrap.className = 'tree-children';
          }

          itemEl.addEventListener('click', (e) => {
            const isToggleClick = e.target.closest('.tree-toggle-icon');
            
            if (hasChildren && isToggleClick) {
              itemEl.querySelector('.tree-toggle-icon').classList.toggle('expanded');
              childrenWrap.classList.toggle('open');
              return;
            }

            document.querySelectorAll('.tree-item').forEach(el => el.classList.remove('active'));
            itemEl.classList.add('active');
            state.selectedSectionKey = node.key;

            if (hasChildren) {
              const toggleIcon = itemEl.querySelector('.tree-toggle-icon');
              if (toggleIcon && !toggleIcon.classList.contains('expanded')) {
                toggleIcon.classList.add('expanded');
                childrenWrap.classList.add('open');
              }
            }

            loadProceduresForSection(node.key, node.title);

            // Transición suave en iPhone a la lista de procedimientos
            if (window.innerWidth <= 768) {
              switchMobileTab('procedures');
            }
          });

          if (node.lvl === 0) {
            currentRoot = childrenWrap;
            systemsTreeContainer.appendChild(itemEl);
            if (childrenWrap) systemsTreeContainer.appendChild(childrenWrap);
          } else if (node.lvl === 1) {
            currentSub = childrenWrap;
            const target = currentRoot || systemsTreeContainer;
            target.appendChild(itemEl);
            if (childrenWrap) target.appendChild(childrenWrap);
          } else {
            const target = currentSub || currentRoot || systemsTreeContainer;
            target.appendChild(itemEl);
            if (childrenWrap) target.appendChild(childrenWrap);
          }

          if (normFilter && isMatch && childrenWrap) {
            childrenWrap.classList.add('open');
          }
        });
      }

      treeFilterInput.addEventListener('input', (e) => {
        renderSystemsTree(e.target.value);
      });

      // 5. CARGAR PROCEDIMIENTOS DE UNA SECCIÓN
      function loadProceduresForSection(sectionKey, sectionTitle) {
        state.viewMode = 'normal';
        favoritesBtn.classList.remove('active');
        recentsBtn.classList.remove('active');

        proceduresPanelTitle.innerHTML = `
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/></svg>
          ${escapeHTML(sectionTitle)}
        `;

        const curData = state.data[state.lang][state.year];
        const dbKeys = (curData.idx && curData.idx[sectionKey]) || [];
        const sieList = curData.sie || {};

        proceduresListContainer.innerHTML = '';
        proceduresCountBadge.textContent = dbKeys.length;
        if (mobileProceduresBadge) mobileProceduresBadge.textContent = dbKeys.length;

        if (dbKeys.length === 0) {
          proceduresListContainer.innerHTML = '<div class="empty-state"><p>No se encontraron procedimientos directos.</p></div>';
          return;
        }

        dbKeys.forEach(dbk => {
          const procInfo = sieList[dbk] || { title: dbk, img: '001' };
          const card = createProcedureCard(dbk, procInfo, sectionTitle);
          proceduresListContainer.appendChild(card);
        });

        // Seleccionar primer procedimiento si no hay ninguno seleccionado (solo en desktop)
        if (dbKeys.length > 0 && !state.selectedProcedureDbKey && window.innerWidth > 768) {
          const firstCard = proceduresListContainer.querySelector('.proc-card');
          if (firstCard) firstCard.click();
        }
      }

      // TARJETAS DE PROCEDIMIENTO
      function createProcedureCard(dbk, procInfo, categoryName) {
        const card = document.createElement('div');
        card.className = 'proc-card' + (state.selectedProcedureDbKey === dbk ? ' active' : '');
        card.setAttribute('data-dbkey', dbk);

        const isBookmarked = state.bookmarks.some(b => b.dbk === dbk);

        let iconSvg = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>';
        const titleLower = (procInfo.title || '').toLowerCase();
        if (titleLower.includes('diagrama') || titleLower.includes('conexiones') || titleLower.includes('eléctric')) {
          iconSvg = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>';
        } else if (titleLower.includes('apriete') || titleLower.includes('normas') || titleLower.includes('límites')) {
          iconSvg = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>';
        } else if (titleLower.includes('inspección') || titleLower.includes('comprobación') || titleLower.includes('diagnóstico')) {
          iconSvg = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>';
        } else if (titleLower.includes('sustitución') || titleLower.includes('desmontaje') || titleLower.includes('instalación')) {
          iconSvg = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>';
        }

        const safeTitle = escapeHTML(procInfo.title || 'Procedimiento');
        const safeDbk = escapeHTML(dbk || '');

        card.innerHTML = `
          <div class="proc-icon-wrap">${iconSvg}</div>
          <div class="proc-details">
            <div class="proc-title">${safeTitle}</div>
            <div class="proc-meta">
              <span>${safeDbk.substring(0, 10)}...</span>
              <button class="proc-fav-btn ${isBookmarked ? 'active' : ''}" title="Marcar como favorito">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="${isBookmarked ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
              </button>
            </div>
          </div>
        `;

        card.querySelector('.proc-fav-btn').addEventListener('click', (e) => {
          e.stopPropagation();
          toggleBookmark(dbk, procInfo.title, categoryName);
          card.querySelector('.proc-fav-btn').classList.toggle('active');
        });

        card.addEventListener('click', () => {
          document.querySelectorAll('.proc-card').forEach(c => c.classList.remove('active'));
          card.classList.add('active');
          loadArticle(dbk, procInfo.title, categoryName);
          // Modo móvil: mostrar visor
          if (window.innerWidth <= 768) {
            switchMobileTab('viewer');
          }
        });

        return card;
      }

      mobileBackBtn.addEventListener('click', () => {
        if (state.lastMobileTab && state.lastMobileTab !== 'viewer') {
          switchMobileTab(state.lastMobileTab);
        } else {
          switchMobileTab('procedures');
        }
      });

      function resetProceduresPanel() {
        proceduresPanelTitle.innerHTML = `
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/></svg>
          Procedimientos
        `;
        proceduresCountBadge.textContent = '0';
        if (mobileProceduresBadge) mobileProceduresBadge.textContent = '0';
        proceduresListContainer.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon-neu">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
            </div>
            <p>Selecciona un sistema en el panel izquierdo para consultar sus guías y diagramas.</p>
          </div>
        `;
      }

      // 6. CARGAR ARTÍCULO TÉCNICO Y ENLACES (100% IN-APP)
      function loadArticle(dbKey, procTitle, categoryName, pushHistory = true) {
        if (!dbKey || !/^[A-Za-z0-9_-]{5,40}$/.test(dbKey)) {
          console.warn('Identificador de artículo inválido rechazado:', dbKey);
          return;
        }
        state.selectedProcedureDbKey = dbKey;
        state.activeDocTitleText = procTitle || '';
        
        const safeCat = escapeHTML(categoryName || 'Sección');
        const safeTitle = escapeHTML(procTitle || '');

        viewerBreadcrumb.innerHTML = `
          <span>${state.lang === 'S00' ? 'Taller' : 'Carrocería'}</span>
          <span>&rsaquo;</span>
          <span>${safeCat}</span>
          <span>&rsaquo;</span>
          <span class="breadcrumb-active" id="activeDocTitle">${safeTitle}</span>
        `;

        // Actualizar botón de favorito del visor
        updateFavDocBtnState();

        // Agregar a historial de recientes
        addToRecents(dbKey, procTitle, categoryName);

        // Actualizar URL sin recargar
        if (pushHistory) {
          const url = new URL(window.location);
          url.searchParams.set('type', state.lang);
          url.searchParams.set('year', state.year);
          url.searchParams.set('doc', dbKey);
          window.history.pushState({ dbKey }, '', url);
        }

        viewerLoader.classList.add('active');

        const subFolder = dbKey.substr(5, 2);
        const articleUrl = `./${state.lang}/HTML/${subFolder}/${dbKey}.HTML`;

        docIframe.onload = () => {
          viewerLoader.classList.remove('active');
          setupIframeHooks();
          injectNeumorphicStylesIntoIframe();
          applyZoom();
        };

        docIframe.src = articleUrl;
      }

      // NAVEGACIÓN DIRECTA A UN DBKEY DESDE ENLACE O URL
      function navigateToDbKey(targetDbKey, pushHistory = true) {
        if (!targetDbKey || !/^[A-Za-z0-9_-]{5,40}$/.test(targetDbKey)) {
          console.warn('Navegación rechazada por clave no válida:', targetDbKey);
          return;
        }
        const curData = state.data[state.lang][state.year];
        const sieItem = curData.sie && curData.sie[targetDbKey];
        const title = sieItem ? sieItem.title : targetDbKey;

        // Encontrar sección correspondiente
        let foundSectionKey = null;
        if (curData.idx) {
          for (const [secKey, keys] of Object.entries(curData.idx)) {
            if (keys.includes(targetDbKey)) {
              foundSectionKey = secKey;
              break;
            }
          }
        }

        if (foundSectionKey) {
          state.selectedSectionKey = foundSectionKey;
          const treeNode = curData.tree.find(t => t.key === foundSectionKey);
          loadProceduresForSection(foundSectionKey, treeNode ? treeNode.title : 'Sección');
        }

        loadArticle(targetDbKey, title, 'Manual', pushHistory);

        // Marcar tarjeta activa
        const matchingCard = document.querySelector(`.proc-card[data-dbkey="${targetDbKey}"]`);
        if (matchingCard) {
          document.querySelectorAll('.proc-card').forEach(c => c.classList.remove('active'));
          matchingCard.classList.add('active');
          matchingCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
      }

      // 7. GANCHOS DENTRO DEL IFRAME: INTERCEPTAR ENLACES Y ZOOM (CERO PESTAÑAS NUEVAS)
      function setupIframeHooks() {
        try {
          const idoc = docIframe.contentDocument || docIframe.contentWindow.document;
          const iwin = docIframe.contentWindow;
          if (!idoc || !iwin) return;

          // Inyectar viewport meta en el iframe para que iOS Safari no lo renderice a 980px de escritorio
          if (idoc.head && !idoc.querySelector('meta[name="viewport"]')) {
            const vmeta = idoc.createElement('meta');
            vmeta.name = 'viewport';
            vmeta.content = 'width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover';
            idoc.head.appendChild(vmeta);
          }

          // INTERCEPTAR TODOS LOS ENLACES <a>
          idoc.querySelectorAll('a').forEach(anchor => {
            anchor.removeAttribute('target');
            anchor.addEventListener('click', (e) => {
              e.preventDefault();
              const href = anchor.getAttribute('href');
              handleInnerLink(href);
            });
          });

          // INTERCEPTAR ZOOM DE IMÁGENES (ZoomOpen)
          iwin.ZoomOpen = function(data) {
            window.openDiagramModal(data);
          };

          // INTERCEPTAR CUALQUIER window.open
          iwin.open = function(url) {
            handleInnerLink(url);
            return null;
          };
        } catch(e) {
          console.warn('Hook warning:', e);
        }
      }

      // MANEJAR CLIC EN ENLACE DENTRO DEL ARTÍCULO
      function handleInnerLink(href) {
        if (!href) return;
        const match = href.match(/([A-Z0-9]{20,35})\.HTML/i);
        if (match && match[1]) {
          navigateToDbKey(match[1], true);
        } else {
          // Si es relativo o hash
          if (href.startsWith('#')) {
            const idoc = docIframe.contentDocument || docIframe.contentWindow.document;
            const targetEl = idoc.querySelector(href);
            if (targetEl) targetEl.scrollIntoView({ behavior: 'smooth' });
          }
        }
      }

      // 8. LIGHTBOX MODAL PARA DIAGRAMAS (CERO POPUPS) + SOPORTE TÁCTIL IPHONE
      window.openDiagramModal = function(data) {
        if (!data || !data.Name || !/^[A-Za-z0-9_-]+$/.test(data.Name)) return;

        state.modalZoomLevel = 100;
        modalDiagramTitle.textContent = data.Title || 'Esquema Técnico / Diagrama';
        
        const imgSrc = `./${state.lang}/PNG/${data.Name}.PNG`;
        modalDiagramImg.src = imgSrc;
        modalDiagramImg.style.width = data.Width ? `${data.Width}px` : 'auto';
        modalDiagramImg.style.height = data.Height ? `${data.Height}px` : 'auto';

        // Renderizar etiquetas (CallOuts)
        modalCalloutsContainer.innerHTML = '';
        if (data.CallOut && Array.isArray(data.CallOut)) {
          data.CallOut.forEach(co => {
            const label = document.createElement('div');
            label.className = 'modal-callout-item';
            label.style.left = `${co.posX}px`;
            label.style.top = `${co.posY}px`;
            label.style.fontSize = `${co.fontSize || 12}px`;
            label.style.fontFamily = co.fontName || 'sans-serif';
            label.style.color = co.Color === 1 ? '#ffffff' : '#000000';
            label.textContent = co.Text || '';
            modalCalloutsContainer.appendChild(label);
          });
        }

        applyModalZoom();
        diagramModal.classList.add('active');
      };

      function applyModalZoom() {
        modalZoomReset.textContent = `${state.modalZoomLevel}%`;
        modalCanvasInner.style.transform = `scale(${state.modalZoomLevel / 100})`;
      }

      modalZoomIn.addEventListener('click', () => {
        if (state.modalZoomLevel < 350) {
          state.modalZoomLevel += 25;
          applyModalZoom();
        }
      });

      modalZoomOut.addEventListener('click', () => {
        if (state.modalZoomLevel > 40) {
          state.modalZoomLevel -= 25;
          applyModalZoom();
        }
      });

      modalZoomReset.addEventListener('click', () => {
        state.modalZoomLevel = 100;
        applyModalZoom();
      });

      modalFitScreen.addEventListener('click', () => {
        const wrapW = modalCanvasWrap.clientWidth - 40;
        const imgW = modalDiagramImg.naturalWidth || modalDiagramImg.clientWidth || 800;
        const ratio = Math.min(Math.round((wrapW / imgW) * 100), 200);
        state.modalZoomLevel = ratio > 40 ? ratio : 100;
        applyModalZoom();
      });

      modalCloseBtn.addEventListener('click', () => {
        diagramModal.classList.remove('active');
      });

      diagramModal.addEventListener('click', (e) => {
        if (e.target === diagramModal) {
          diagramModal.classList.remove('active');
        }
      });

      window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          diagramModal.classList.remove('active');
        }
      });

      // GESTOS TÁCTILES PINCH-TO-ZOOM Y ARRASTRE PARA IPHONE EN EL MODAL
      let touchStartDist = 0;
      let touchStartZoom = 100;
      let isTouchPanning = false;
      let touchPanStartX = 0;
      let touchPanStartY = 0;
      let touchScrollStartX = 0;
      let touchScrollStartY = 0;
      let lastTapTime = 0;

      modalCanvasWrap.addEventListener('touchstart', (e) => {
        if (e.touches.length === 2) {
          // Gesto de pellizco (Pinch to zoom)
          const dx = e.touches[0].clientX - e.touches[1].clientX;
          const dy = e.touches[0].clientY - e.touches[1].clientY;
          touchStartDist = Math.hypot(dx, dy);
          touchStartZoom = state.modalZoomLevel;
        } else if (e.touches.length === 1) {
          // Desplazamiento táctil (Pan)
          isTouchPanning = true;
          touchPanStartX = e.touches[0].clientX;
          touchPanStartY = e.touches[0].clientY;
          touchScrollStartX = modalCanvasWrap.scrollLeft;
          touchScrollStartY = modalCanvasWrap.scrollTop;

          // Doble toque para ampliar/restablecer
          const now = Date.now();
          if (now - lastTapTime < 300) {
            state.modalZoomLevel = state.modalZoomLevel > 115 ? 100 : 175;
            applyModalZoom();
          }
          lastTapTime = now;
        }
      }, { passive: true });

      modalCanvasWrap.addEventListener('touchmove', (e) => {
        if (e.touches.length === 2 && touchStartDist > 0) {
          const dx = e.touches[0].clientX - e.touches[1].clientX;
          const dy = e.touches[0].clientY - e.touches[1].clientY;
          const currentDist = Math.hypot(dx, dy);
          const factor = currentDist / touchStartDist;
          const newZoom = Math.min(Math.max(Math.round(touchStartZoom * factor), 40), 350);
          state.modalZoomLevel = newZoom;
          applyModalZoom();
        } else if (e.touches.length === 1 && isTouchPanning) {
          const deltaX = e.touches[0].clientX - touchPanStartX;
          const deltaY = e.touches[0].clientY - touchPanStartY;
          modalCanvasWrap.scrollLeft = touchScrollStartX - deltaX;
          modalCanvasWrap.scrollTop = touchScrollStartY - deltaY;
        }
      }, { passive: true });

      modalCanvasWrap.addEventListener('touchend', (e) => {
        if (e.touches.length < 2) touchStartDist = 0;
        if (e.touches.length === 0) isTouchPanning = false;
      }, { passive: true });

      // Arrastre con ratón en escritorio
      let isMouseDragging = false;
      let mouseStartX = 0;
      let mouseStartY = 0;
      let mouseScrollStartX = 0;
      let mouseScrollStartY = 0;

      modalCanvasWrap.addEventListener('mousedown', (e) => {
        isMouseDragging = true;
        modalCanvasWrap.style.cursor = 'grabbing';
        mouseStartX = e.clientX;
        mouseStartY = e.clientY;
        mouseScrollStartX = modalCanvasWrap.scrollLeft;
        mouseScrollStartY = modalCanvasWrap.scrollTop;
      });

      window.addEventListener('mousemove', (e) => {
        if (!isMouseDragging) return;
        const dx = e.clientX - mouseStartX;
        const dy = e.clientY - mouseStartY;
        modalCanvasWrap.scrollLeft = mouseScrollStartX - dx;
        modalCanvasWrap.scrollTop = mouseScrollStartY - dy;
      });

      window.addEventListener('mouseup', () => {
        if (isMouseDragging) {
          isMouseDragging = false;
          modalCanvasWrap.style.cursor = 'grab';
        }
      });

      // 9. ESTILOS NEUMÓRFICOS INYECTADOS EN EL DOCUMENTO (ADAPTADOS A IPHONE)
      function injectNeumorphicStylesIntoIframe() {
        try {
          const idoc = docIframe.contentDocument || docIframe.contentWindow.document;
          if (!idoc || !idoc.head) return;

          let styleTag = idoc.getElementById('honda-neu-styles');
          if (!styleTag) {
            styleTag = idoc.createElement('style');
            styleTag.id = 'honda-neu-styles';
            idoc.head.appendChild(styleTag);
          }

          const isDark = state.theme === 'dark';
          const bg = isDark ? '#16181d' : '#f8fafc';
          const text = isDark ? '#f8fafc' : '#1e293b';
          const cardBg = isDark ? '#1d2128' : '#ffffff';
          const shadow = isDark 
            ? '4px 4px 10px #0e1014, -4px -4px 10px #222730' 
            : '4px 4px 10px #e2e8f0, -4px -4px 10px #ffffff';
          const border = isDark ? '1px solid #282e38' : '1px solid #e2e8f0';
          const primary = isDark ? '#ef4444' : '#dc2626';

          styleTag.textContent = `
            * {
              box-sizing: border-box !important;
              -webkit-tap-highlight-color: transparent !important;
            }
            body {
              font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Inter", sans-serif !important;
              background-color: ${bg} !important;
              color: ${text} !important;
              padding: 14px 16px 50px 16px !important;
              line-height: 1.65 !important;
              font-size: 15px !important;
              -webkit-text-size-adjust: 100% !important;
              word-break: break-word !important;
            }
            @media (min-width: 769px) {
              body {
                padding: 22px 30px !important;
                font-size: 14px !important;
              }
            }
            h2, h3, h4 {
              color: ${text} !important;
              font-weight: 700 !important;
              margin: 16px 0 12px 0 !important;
              display: inline-flex !important;
              max-width: 100% !important;
              align-items: center !important;
              padding: 8px 14px !important;
              border-radius: 12px !important;
              background: ${cardBg} !important;
              box-shadow: ${shadow} !important;
              border-left: 4px solid ${primary} !important;
              font-size: 1.05rem !important;
              line-height: 1.35 !important;
            }
            h2 b, h3 b, h4 b { color: ${text} !important; }
            p { margin-bottom: 14px !important; color: ${text} !important; }
            
            a {
              color: ${primary} !important;
              text-decoration: none !important;
              font-weight: 600 !important;
              padding: 3px 6px !important;
              border-radius: 6px !important;
              display: inline-block !important;
              transition: background 0.15s ease !important;
              touch-action: manipulation !important;
            }
            a:hover, a:active {
              text-decoration: underline !important;
              background: ${isDark ? 'rgba(239,68,68,0.2)' : '#fee2e2'} !important;
            }

            /* Tablas con diseño moderno y scroll horizontal táctil en iPhone */
            table {
              border-collapse: separate !important;
              border-spacing: 0 !important;
              background: ${cardBg} !important;
              border-radius: 14px !important;
              box-shadow: ${shadow} !important;
              margin: 16px 0 !important;
              overflow-x: auto !important;
              display: block !important;
              max-width: 100% !important;
              -webkit-overflow-scrolling: touch !important;
              border: ${border} !important;
              font-size: 13.5px !important;
            }
            th, td {
              padding: 10px 12px !important;
              border-bottom: ${border} !important;
              border-right: ${border} !important;
              color: ${text} !important;
            }
            th {
              background: ${isDark ? '#232832' : '#f1f5f9'} !important;
              font-weight: 700 !important;
              color: ${primary} !important;
            }
            tr:last-child td { border-bottom: none !important; }
            td:last-child, th:last-child { border-right: none !important; }

            /* Alertas de atención / precaución */
            table.ATT {
              border: none !important;
              background: ${isDark ? 'rgba(239, 68, 68, 0.14)' : '#fef2f2'} !important;
              border-left: 5px solid ${primary} !important;
              border-radius: 12px !important;
              box-shadow: ${shadow} !important;
              margin: 16px 0 !important;
              display: block !important;
              width: 100% !important;
            }
            table.ATT td.ATT1 {
              background: transparent !important;
              color: ${primary} !important;
              font-weight: 800 !important;
              letter-spacing: 0.05em !important;
            }

            /* Contenedores de figuras e ilustraciones */
            div.FIG, div.FIGN {
              background: ${cardBg} !important;
              border-radius: 16px !important;
              box-shadow: ${shadow} !important;
              padding: 12px !important;
              margin: 16px 0 !important;
              display: block !important;
              max-width: 100% !important;
              overflow-x: auto !important;
              -webkit-overflow-scrolling: touch !important;
              border: ${border} !important;
              text-align: center !important;
            }
            img {
              max-width: 100% !important;
              height: auto !important;
              border-radius: 8px !important;
              cursor: pointer !important;
              display: inline-block !important;
              touch-action: manipulation !important;
            }
          `;
        } catch(e) {}
      }

      // 10. BÚSQUEDA GLOBAL (ESCRITORIO Y MÓVIL)
      let searchTimer = null;
      function handleSearchInput(query) {
        globalSearchInput.value = query;
        if (mobileSearchInput) mobileSearchInput.value = query;

        const hasText = query.length > 0;
        searchClearBtn.classList.toggle('visible', hasText);
        if (mobileSearchClearBtn) mobileSearchClearBtn.classList.toggle('visible', hasText);

        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => {
          executeGlobalSearch(query);
        }, 220);
      }

      globalSearchInput.addEventListener('input', (e) => {
        handleSearchInput(e.target.value.trim());
      });

      if (mobileSearchInput) {
        mobileSearchInput.addEventListener('input', (e) => {
          handleSearchInput(e.target.value.trim());
        });
      }

      function clearSearch() {
        globalSearchInput.value = '';
        if (mobileSearchInput) mobileSearchInput.value = '';
        searchClearBtn.classList.remove('visible');
        if (mobileSearchClearBtn) mobileSearchClearBtn.classList.remove('visible');

        if (state.selectedSectionKey) {
          const curData = state.data[state.lang][state.year];
          const node = curData.tree.find(t => t.key === state.selectedSectionKey);
          loadProceduresForSection(state.selectedSectionKey, node ? node.title : 'Procedimientos');
        } else {
          resetProceduresPanel();
        }
      }

      searchClearBtn.addEventListener('click', clearSearch);
      if (mobileSearchClearBtn) mobileSearchClearBtn.addEventListener('click', clearSearch);

      function executeGlobalSearch(query) {
        if (!query) {
          if (state.selectedSectionKey) {
            const curData = state.data[state.lang][state.year];
            const node = curData.tree.find(t => t.key === state.selectedSectionKey);
            loadProceduresForSection(state.selectedSectionKey, node ? node.title : 'Procedimientos');
          } else {
            resetProceduresPanel();
          }
          return;
        }

        const normQuery = query.toLowerCase();
        const curData = state.data[state.lang][state.year];
        const sieList = curData.sie || {};

        const matches = [];
        for (const [dbk, item] of Object.entries(sieList)) {
          if (item.title && item.title.toLowerCase().includes(normQuery)) {
            matches.push({ dbk, ...item });
          }
        }

        const safeQuery = escapeHTML(query);

        proceduresPanelTitle.innerHTML = `
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          Resultados: "${safeQuery}"
        `;
        proceduresCountBadge.textContent = matches.length;
        if (mobileProceduresBadge) mobileProceduresBadge.textContent = matches.length;
        proceduresListContainer.innerHTML = '';

        if (matches.length === 0) {
          proceduresListContainer.innerHTML = `
            <div class="empty-state">
              <p>No se encontraron resultados para "<b>${safeQuery}</b>".</p>
            </div>
          `;
          return;
        }

        matches.forEach(m => {
          const card = createProcedureCard(m.dbk, m, 'Búsqueda');
          proceduresListContainer.appendChild(card);
        });
      }

      // 11. FAVORITOS Y RECIENTES
      function toggleBookmark(dbk, title, section) {
        const idx = state.bookmarks.findIndex(b => b.dbk === dbk);
        if (idx >= 0) {
          state.bookmarks.splice(idx, 1);
        } else {
          state.bookmarks.push({ dbk, title, section });
        }
        localStorage.setItem('honda_bookmarks', JSON.stringify(state.bookmarks));
        updateFavDocBtnState();
        updateBookmarkBadges();
      }

      function updateBookmarkBadges() {
        if (mobileFavoritesBadge) {
          mobileFavoritesBadge.textContent = state.bookmarks.length;
          mobileFavoritesBadge.style.display = state.bookmarks.length > 0 ? 'inline-block' : 'none';
        }
      }

      function updateFavDocBtnState() {
        const isBookmarked = state.bookmarks.some(b => b.dbk === state.selectedProcedureDbKey);
        favDocStar.setAttribute('fill', isBookmarked ? 'currentColor' : 'none');
        favDocStar.style.color = isBookmarked ? '#eab308' : 'inherit';
      }

      favDocBtn.addEventListener('click', () => {
        if (state.selectedProcedureDbKey) {
          toggleBookmark(state.selectedProcedureDbKey, state.activeDocTitleText, 'Manual');
        }
      });

      function renderFavoritesView() {
        state.viewMode = 'favorites';
        favoritesBtn.classList.add('active');
        recentsBtn.classList.remove('active');

        proceduresPanelTitle.innerHTML = `
          <svg width="15" height="15" viewBox="0 0 24 24" fill="#eab308" stroke="#eab308" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          Mis Favoritos
        `;
        proceduresCountBadge.textContent = state.bookmarks.length;
        if (mobileProceduresBadge) mobileProceduresBadge.textContent = state.bookmarks.length;
        proceduresListContainer.innerHTML = '';

        if (state.bookmarks.length === 0) {
          proceduresListContainer.innerHTML = '<div class="empty-state"><p>Aún no tienes procedimientos guardados en favoritos.<br><br>Pulsa el icono ⭐ en cualquier guía técnica para acceder rápidamente desde aquí.</p></div>';
          return;
        }

        state.bookmarks.forEach(b => {
          const card = createProcedureCard(b.dbk, { title: b.title }, b.section);
          proceduresListContainer.appendChild(card);
        });
      }

      function renderRecentsView() {
        state.viewMode = 'recents';
        recentsBtn.classList.add('active');
        favoritesBtn.classList.remove('active');

        proceduresPanelTitle.innerHTML = `
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          Consultados Recientemente
        `;
        proceduresCountBadge.textContent = state.recents.length;
        if (mobileProceduresBadge) mobileProceduresBadge.textContent = state.recents.length;
        proceduresListContainer.innerHTML = '';

        if (state.recents.length === 0) {
          proceduresListContainer.innerHTML = '<div class="empty-state"><p>Historial vacío.</p></div>';
          return;
        }

        state.recents.forEach(r => {
          const card = createProcedureCard(r.dbk, { title: r.title }, r.section);
          proceduresListContainer.appendChild(card);
        });
      }

      favoritesBtn.addEventListener('click', () => {
        if (state.viewMode === 'favorites') {
          state.viewMode = 'normal';
          favoritesBtn.classList.remove('active');
          if (state.selectedSectionKey) {
            const curData = state.data[state.lang][state.year];
            const node = curData.tree.find(t => t.key === state.selectedSectionKey);
            loadProceduresForSection(state.selectedSectionKey, node ? node.title : 'Procedimientos');
          } else {
            resetProceduresPanel();
          }
        } else {
          renderFavoritesView();
          if (window.innerWidth <= 768) {
            switchMobileTab('favorites');
          }
        }
      });

      function addToRecents(dbk, title, section) {
        state.recents = state.recents.filter(r => r.dbk !== dbk);
        state.recents.unshift({ dbk, title, section });
        if (state.recents.length > 25) state.recents.pop();
        localStorage.setItem('honda_recents', JSON.stringify(state.recents));
      }

      recentsBtn.addEventListener('click', () => {
        if (state.viewMode === 'recents') {
          state.viewMode = 'normal';
          recentsBtn.classList.remove('active');
          if (state.selectedSectionKey) {
            const curData = state.data[state.lang][state.year];
            const node = curData.tree.find(t => t.key === state.selectedSectionKey);
            loadProceduresForSection(state.selectedSectionKey, node ? node.title : 'Procedimientos');
          } else {
            resetProceduresPanel();
          }
        } else {
          renderRecentsView();
          if (window.innerWidth <= 768) {
            switchMobileTab('procedures');
          }
        }
      });

      // 12. NAVEGACIÓN POR PESTAÑAS MÓVIL (TAB BAR IPHONE)
      function switchMobileTab(tabName) {
        if (state.mobileTab !== 'viewer' && tabName === 'viewer') {
          state.lastMobileTab = state.mobileTab;
        }
        state.mobileTab = tabName;

        // Actualizar estados visuales de las pestañas inferiores
        document.querySelectorAll('.tab-btn').forEach(btn => {
          btn.classList.toggle('active', btn.getAttribute('data-tab') === tabName);
        });

        // Activar el panel correspondiente
        panelSystems.classList.remove('mobile-active');
        panelProcedures.classList.remove('mobile-active');
        panelViewer.classList.remove('mobile-active');

        if (mobileSearchWrap) mobileSearchWrap.style.display = 'none';

        if (tabName === 'systems') {
          panelSystems.classList.add('mobile-active');
        } else if (tabName === 'procedures') {
          panelProcedures.classList.add('mobile-active');
          if (state.viewMode !== 'normal') {
            if (state.selectedSectionKey) {
              const curData = state.data[state.lang][state.year];
              const node = curData.tree.find(t => t.key === state.selectedSectionKey);
              loadProceduresForSection(state.selectedSectionKey, node ? node.title : 'Procedimientos');
            }
          }
        } else if (tabName === 'viewer') {
          panelViewer.classList.add('mobile-active');
        } else if (tabName === 'search') {
          panelProcedures.classList.add('mobile-active');
          if (mobileSearchWrap) {
            mobileSearchWrap.style.display = 'block';
            setTimeout(() => {
              if (mobileSearchInput) mobileSearchInput.focus();
            }, 120);
          }
          if (!globalSearchInput.value) {
            proceduresPanelTitle.innerHTML = `
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
              Buscador Global
            `;
            proceduresCountBadge.textContent = '0';
            if (mobileProceduresBadge) mobileProceduresBadge.textContent = '0';
            proceduresListContainer.innerHTML = '<div class="empty-state"><p>Escribe arriba cualquier término técnico (ej. frenos, embrague, correa, sensor...).</p></div>';
          }
        } else if (tabName === 'favorites') {
          panelProcedures.classList.add('mobile-active');
          renderFavoritesView();
        }
      }

      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const tab = btn.getAttribute('data-tab');
          switchMobileTab(tab);
        });
      });

      // 13. ZOOM Y CONTROLES DEL VISOR
      function applyZoom() {
        zoomResetBtn.textContent = `${state.zoomLevel}%`;
        try {
          const idoc = docIframe.contentDocument || docIframe.contentWindow.document;
          if (idoc && idoc.body) {
            idoc.body.style.zoom = `${state.zoomLevel}%`;
            // Fallback para motores WebKit que no propagan body.style.zoom a textos
            idoc.body.style.fontSize = `${(state.zoomLevel / 100) * 14}px`;
          }
        } catch(e) {}
      }

      zoomInBtn.addEventListener('click', () => {
        if (state.zoomLevel < 200) {
          state.zoomLevel += 15;
          applyZoom();
        }
      });

      zoomOutBtn.addEventListener('click', () => {
        if (state.zoomLevel > 65) {
          state.zoomLevel -= 15;
          applyZoom();
        }
      });

      zoomResetBtn.addEventListener('click', () => {
        state.zoomLevel = 100;
        applyZoom();
      });

      printBtn.addEventListener('click', () => {
        try {
          docIframe.contentWindow.focus();
          docIframe.contentWindow.print();
        } catch(e) {
          window.print();
        }
      });

      fullscreenBtn.addEventListener('click', () => {
        document.body.classList.toggle('viewer-fullscreen');
      });

      // 14. NAVEGACIÓN ATRÁS/ADELANTE DEL NAVEGADOR (popstate)
      window.addEventListener('popstate', (e) => {
        if (e.state && e.state.dbKey) {
          navigateToDbKey(e.state.dbKey, false);
        }
      });

      // INICIAR
      loadDatabase();
    })();
  </script>
</body>
</html>
