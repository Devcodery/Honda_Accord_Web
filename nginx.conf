server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Deshabilitar firma de versión de Nginx (CWE-200)
    server_tokens off;

    # Deshabilitar listado de directorios (CWE-548)
    autoindex off;

    # Protección contra ataques de denegación de servicio (DoS) y buffers grandes
    client_body_buffer_size 128k;
    client_max_body_size 1m;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 4k;
    client_body_timeout 12s;
    client_header_timeout 12s;
    keepalive_timeout 20s;
    send_timeout 10s;

    # Restricción estricta de métodos HTTP (Solo lectura)
    if ($request_method !~ ^(GET|HEAD)$ ) {
        return 405;
    }

    # Cabeceras de seguridad globales (Estándares OWASP)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; frame-src 'self' about:; object-src 'none'; base-uri 'self';" always;

    # Compresión gzip segura
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 256;

    charset utf-8;

    # Bloquear estrictamente cualquier archivo oculto (.git, .env, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # Bloquear acceso a archivos del servidor y despliegue
    location ~* (?:server\.py|Dockerfile|docker-compose\.ya?ml|nginx\.conf|README\.md|\.dockerignore|\.gitignore)$ {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Artículos técnicos HTML antiguos (ISO-8859-1 original)
    location ~* \.html?$ {
        charset iso-8859-1;
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; frame-src 'self' about:; object-src 'none'; base-uri 'self';" always;
    }

    location = /index.html {
        charset utf-8;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; frame-src 'self' about:; object-src 'none'; base-uri 'self';" always;
    }

    # Caché estricta para recursos estáticos inmutables
    location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|woff2?|eot|ttf|otf)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # Base de datos JSON
    location = /esm_data.json {
        charset utf-8;
        add_header Content-Type "application/json; charset=utf-8";
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
    }
}
