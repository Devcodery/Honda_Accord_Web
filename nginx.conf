server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Compresión gzip para máxima velocidad en redes móviles
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;

    # Codificación de caracteres para evitar problemas con tildes
    charset utf-8;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Artículos técnicos HTML antiguos (ISO-8859-1 original)
    location ~* \.html?$ {
        charset iso-8859-1;
        add_header Cache-Control "public, max-age=86400";
    }

    location = /index.html {
        charset utf-8;
        add_header Cache-Control "no-cache";
    }

    # Caché óptima para imágenes PNG y fuentes
    location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|woff2?|eot|ttf|otf)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # Base de datos JSON
    location = /esm_data.json {
        charset utf-8;
        add_header Content-Type "application/json; charset=utf-8";
        add_header Cache-Control "public, max-age=604800";
    }
}
