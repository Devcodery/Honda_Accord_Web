services:
  honda-accord-manual:
    build: .
    container_name: honda_accord_esm
    restart: unless-stopped
    ports:
      - "8081:80"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETGID
      - SETUID
    environment:
      - TZ=Europe/Madrid
