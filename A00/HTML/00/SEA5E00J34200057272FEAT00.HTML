with(document){ESM.iDT[0]=new ISEA3E00J34200057272FEAD01();ESM.iDT[1]=new IS80WA00J34200041001FEAD02();}//--></script></head><body><h2>Sunroof Motor Test</h2><p><table cols="2" width="100%"><tr><td id="i010" width="1%" valign="top" nowrap>1.</td><td valign="top" width="99%"><a href="../20/SEA5E20J26200031201KDAT00.HTML">Remove the headliner.</a><br><br></td></tr></table></p><p><table cols="2" width="100%"><tr><td id="i020" width="1%" valign="top" nowrap>2.</td><td valign="top" width="99%">Disconnect the 2P connector from the sunroof motor.<br><p class="FIG">&nbsp;<div class="FIG"><script>FIL(1,gESM.iDT[0],gESM.iDT[0].Width);</script></div></p></td></tr></table></p><p><table cols="2" width="100%"><tr><td id="i030" width="1%" valign="top" nowrap>3.</td><td valign="top" width="99%">Check the motor by connecting power and ground according to the table.<br><p class="FIG">&nbsp;<div class="FIG"><script>FIL(2,gESM.iDT[1],512);</script></div></p></td></tr></table></p><p><table cols="2" width="100%"><tr><td id="i040" width="1%" valign="top" nowrap>4.</td><td valign="top" width="99%">If the motor does not run, replace it.<br><br>NOTE: <a href="./SEA5E00J34200000000FEAT00.HTML">See closing force check</a> for motor clutch test.<br></td></tr></table></p></body></html>
