with(document){ESM.iDT[0]=new ISEA5E00J18573462203KBAD01();}//--></script></head><body><h2>Rear Under Cover Replacement</h2><p><table cols="2" width="100%"><tr><td id="i010" width="1%" valign="top" nowrap>1.</td><td valign="top" width="99%">Remove the clips (A) and bolts (B), then remove the rear under cover (C). Take care not to scratch the rear bumper (D).<br><p class="FIG">&nbsp;<div class="FIG"><script>FIL(1,gESM.iDT[0],gESM.iDT[0].Width);</script></div></p></td></tr></table></p><p><table cols="2" width="100%"><tr><td id="i020" width="1%" valign="top" nowrap>2.</td><td valign="top" width="99%">Install the cover in the reverse order of removal, and replace any damaged clips.<br><br></td></tr></table></p></body></html>
