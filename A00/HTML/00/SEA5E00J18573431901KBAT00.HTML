with(document){ESM.iDT[0]=new ISEA3E00J18573431901KBAD60();}//--></script></head><body><h2>Hood Molding Replacement</h2><p><table cols="2" width="100%"><tr><td id="i010" width="1%" valign="top" nowrap>1.</td><td valign="top" width="99%">Remove the nuts (A), and detach the clip (B) by pushing it from the drain hole (C) in the hood, then remove the hood molding (D). Take care not to scratch the hood.<br><p class="FIG">&nbsp;<div class="FIG"><script>FIL(1,gESM.iDT[0],gESM.iDT[0].Width);</script></div></p></td></tr></table></p><p><table cols="2" width="100%"><tr><td id="i020" width="1%" valign="top" nowrap>2.</td><td valign="top" width="99%">Install the molding in the reverse order of removal, and replace the clip if it's damaged.<br></td></tr></table></p></body></html>
