with(document){ESM.iDT[0]=new ISEA3E00R31100000000YDAD71();}//--></script></head><body><h2>Rear Floor/Rear Floor Cross-member Removal</h2><p>Cut the rear floor 15 mm (0.6 in.) from the welded flange of the rear floor cross-member.<br>NOTE: Do not cut the rear frame stiffener.<br><br>If necessary, cut the rear frame, and replace the rear floor cross-member.<br><p class="FIG">&nbsp;<div class="FIG"><script>FIL(1,gESM.iDT[0],512);</script></div></p></p></body></html>
