with(document){ESM.iDT[0]=new ISEA3ED0A20324112947KBSD01();ESM.iDT[1]=new ISEA5E12A20324112947KBSD01();}//--></script></head><body><h2>Sustitución del sensor APP</h2><p><table cols="2" width="100%"><tr><td id="i010" width="1%" valign="top" nowrap>1.</td><td valign="top" width="99%"><a href="../13/SEA5E13A20336359411KDST00.HTML">Desmonte el cable del acelerador.</a><br><br></td></tr></table></p><p><table cols="2" width="100%"><tr><td id="i020" width="1%" valign="top" nowrap>2.</td><td valign="top" width="99%">Desconecte el conector (A) 6P del sensor (APP) de posición del pedal del acelerador.<br><br><p class="FIG"><b>Modelo LHD:</b>&nbsp;<div class="FIG"><script>FIL(1,gESM.iDT[0],gESM.iDT[0].Width);</script></div></p><p class="FIG"><b>Modelo RHD:</b>&nbsp;<div class="FIG"><script>FIL(2,gESM.iDT[1],gESM.iDT[1].Width);</script></div></p></td></tr></table></p><p><table cols="2" width="100%"><tr><td id="i030" width="1%" valign="top" nowrap>3.</td><td valign="top" width="99%">Desmonte los tornillos (B) y el sensor de APP (C).<br><br></td></tr></table></p><p><table cols="2" width="100%"><tr><td id="i040" width="1%" valign="top" nowrap>4.</td><td valign="top" width="99%">Monte el sensor invirtiendo el orden de desmontaje.<br></td></tr></table></p></body></html>
